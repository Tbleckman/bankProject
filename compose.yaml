services:

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: banking_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./banking_schema.sql:/docker-entrypoint-initdb.d/banking_schema.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  app:

    depends_on:
      db:
        condition: service_healthy
      risk_service:
        condition: service_healthy

    build: .

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: banking_system
      DB_USER: postgres
      DB_PASSWORD: postgres

      RISK_SERVICE_HOST: risk-service
      RISK_SERVICE_PORT: 8000

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  risk_service:
    build: ./risk_service

    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - risk-service

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: