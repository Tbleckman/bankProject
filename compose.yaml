services:

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: banking_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./banking_schema.sql:/docker-entrypoint-initdb.d/banking_schema.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  app:
    build: .

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: banking_system
      DB_USER: postgres
      DB_PASSWORD: postgres
    
    depends_on:
      db:
        condition: service_healthy
    
    stdin_open: true
    tty: true

  risk_service:
    build: ./risk_service

    ports:
      - "8000:8000"

volumes:
  postgres_data: