name: Build and Deploy to ECS

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "risk_service/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"

# Required for OIDC - GitHub mints a short-lived token this workflow
# exchanges with AWS STS. No AWS access keys stored anywhere.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO_APP: bankproject/app
  ECR_REPO_RISK: bankproject/risk-service
  ECS_CLUSTER: bankproject-cluster
  ECS_SERVICE: bankproject-service
  TASK_DEF_FAMILY: bankproject-task
  CONTAINER_APP: app
  CONTAINER_RISK: risk-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # role-to-assume comes from the `terraform output github_deploy_role_arn`
      # in infra/environments/dev - set it as a repo VARIABLE (not a secret,
      # a role ARN isn't sensitive on its own) at
      # Settings > Secrets and variables > Actions > Variables
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO_APP:$TAG" .
          docker push "$REGISTRY/$ECR_REPO_APP:$TAG"

      - name: Build and push risk-service image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO_RISK:$TAG" ./risk_service
          docker push "$REGISTRY/$ECR_REPO_RISK:$TAG"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Render app container into the task def
        id: render-app
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_APP }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_APP }}:${{ github.sha }}

      - name: Render risk-service container into the task def
        id: render-risk
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-app.outputs.task-definition }}
          container-name: ${{ env.CONTAINER_RISK }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_RISK }}:${{ github.sha }}

      - name: Register new task def revision and deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-risk.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
